modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "cinematiccompat"
version = "${version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "heeyyooy"
description = '''
Unofficial NeoForge compatibility addon for Cinematic Interactions 0.18.30 on Minecraft 1.21.1.
Provides integrations for Easy Magic, Easy Anvils, Goety, Combat Roll, Carved Wood, Every Compat, Quark, Caverns & Chasms, and Amendments.
'''

[[dependencies.cinematiccompat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "cinematic"
type = "required"
versionRange = "[0.18.30]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "amendments"
type = "optional"
versionRange = "[1.21-2.2.7,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "goety"
type = "optional"
versionRange = "[3.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "easyanvils"
type = "optional"
versionRange = "[21.1.0,)"
ordering = "AFTER"
