modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "cinematiccompat"
version = "${version}"
displayName = "Cinematic Interactions Compatibility Addon"
authors = "heeyyooy"
description = '''
Standalone compatibility addon for Cinematic Interactions 0.18.30 on Minecraft 1.21.1 / NeoForge 21.1.
Adds support for modded workstations while reusing the original mod's scenes and interactions.
'''

[[dependencies.cinematiccompat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "cinematic"
type = "required"
versionRange = "[0.18.30]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.cinematiccompat]]
modId = "amendments"
type = "optional"
versionRange = "[1.21-2.2.7,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "cinematiccompat.mixins.json"
